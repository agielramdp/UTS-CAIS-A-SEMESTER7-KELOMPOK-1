<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAIS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Navigasi -->
    <nav class="navbar">
        <a href="../index.html" class="nav-brand">
            🎓 CAIS Portal
        </a>
        <ul class="nav-links">
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="mahasiswa.html">Data Mahasiswa</a></li>
        </ul>
    </nav>

    <!-- Form Login Sederhana -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Login Portal CAIS</h2>
                <p>Masukkan NIM/Email untuk mengakses akun Anda</p>
            </div>

            <!-- Tempat Pesan Validasi / Notifikasi -->
            <div id="loginAlert" class="alert-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">NIM atau Email</label>
                    <input type="text" id="username" name="username" placeholder="Contoh: 11523001" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn-login">Masuk ke Sistem</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 <strong>UTS CAIS - Kelas A Semester 7</strong> | Kelompok 1</p>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
